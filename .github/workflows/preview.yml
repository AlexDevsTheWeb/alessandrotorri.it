name: Preview

on:
  pull_request:
    branches: [development, main]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'alessandrotorri-it' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: preview-dist
          path: dist
          retention-days: 1

  deploy-preview:
    needs: verify
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ALESSANDROTORRI_IT || secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: preview-dist
          path: dist
      - name: Deploy preview channel
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ env.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          channelId: preview-${{ github.event.pull_request.number }}
          expires: 7d
      - name: Deployment secret missing
        if: env.FIREBASE_SERVICE_ACCOUNT == ''
        run: echo "No Firebase credentials (FIREBASE_SERVICE_ACCOUNT_ALESSANDROTORRI_IT or FIREBASE_SERVICE_ACCOUNT); skipping the preview deployment."
